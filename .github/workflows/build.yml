name: Build LVGL firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build firmware
        run: |
          pio run

      - name: Merge firmware into one BIN
        run: |
          esptool.py merge_bin \
            -o LVGL.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000 .pio/build/esp32-s3/bootloader.bin \
            0x8000 .pio/build/esp32-s3/partitions.bin \
            0x10000 .pio/build/esp32-s3/firmware.bin

      - name: Upload single firmware
        uses: actions/upload-artifact@v4
        with:
          name: LVGL-single-firmware
          path: LVGL.bin
