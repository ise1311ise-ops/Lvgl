name: Build BarakatTime One BIN


on:
  push:
    branches:
      - main

  workflow_dispatch:



jobs:

 build:

  runs-on: ubuntu-latest


  steps:

  - uses: actions/checkout@v4


  - name: Install PlatformIO

    run:

      pip install platformio



  - name: Build firmware

    run:

      pio run



  - name: Merge binaries

    run: |


      python -m pip install esptool


      esptool.py merge_bin \
      -o BarakatTime.bin \
      --flash_mode dio \
      --flash_freq 80m \
      --flash_size 16MB \
      0x0 .pio/build/esp32-s3-touch-lcd-1-69/bootloader.bin \
      0x8000 .pio/build/esp32-s3-touch-lcd-1-69/partitions.bin \
      0x10000 .pio/build/esp32-s3-touch-lcd-1-69/firmware.bin



  - name: Upload

    uses: actions/upload-artifact@v4

    with:

      name: BarakatTime-One-BIN

      path: BarakatTime.bin
